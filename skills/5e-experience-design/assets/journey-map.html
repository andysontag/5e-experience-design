<title>5E Journey Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="map-css">
/* Layout: overview grid, then the 5E arch (Meaningful Outcomes over five phase arrows, emotions inside) with phase columns below; step-by-step guide on the right. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#1c2226; --ink-2:#4d575d; --ink-3:#7c868b;
  --rule:#d9ddd8; --accent:#d0582f; --accent-soft:#f6ddd2; --on-accent:#ffffff;
  --mo:#f7dc1b; --mo-soft:#fbf1a6; --on-mo:#1c2226;
  --ok:#2f7d5b; --ok-soft:#dcefe4; --thin:#a86b00; --thin-soft:#f7e8c7; --empty:#a3abaf;
  --p1:#c9572e; --p2:#b88414; --p3:#2f7d5b; --p4:#2d6a96; --p5:#7a4d9a;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171a; --surface:#1a2125; --sunk:#151b1e; --ink:#e8ece9; --ink-2:#b3bdc0; --ink-3:#869195;
  --rule:#2c363b; --accent:#ef7a50; --accent-soft:#3a2219; --on-accent:#1a0d08;
  --mo:#e9cd1f; --mo-soft:#4a4214; --on-mo:#15191b;
  --ok:#5cc393; --ok-soft:#173226; --thin:#e0a93c; --thin-soft:#3a2d12; --empty:#5e686c;
  --p1:#ef7a50; --p2:#e0b04a; --p3:#5cc393; --p4:#6aa9d8; --p5:#b690d6; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12171a; --surface:#1a2125; --sunk:#151b1e; --ink:#e8ece9; --ink-2:#b3bdc0; --ink-3:#869195;
  --rule:#2c363b; --accent:#ef7a50; --accent-soft:#3a2219; --on-accent:#1a0d08;
  --mo:#e9cd1f; --mo-soft:#4a4214; --on-mo:#15191b;
  --ok:#5cc393; --ok-soft:#173226; --thin:#e0a93c; --thin-soft:#3a2d12; --empty:#5e686c;
  --p1:#ef7a50; --p2:#e0b04a; --p3:#5cc393; --p4:#6aa9d8; --p5:#b690d6; color-scheme:dark; }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 40px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}

/* ---------- map side ---------- */
.map{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.title-row{display:flex;flex-direction:column;gap:2px}
.title-in{font-family:var(--display);font-size:32px;font-weight:800;border:0;background:transparent;padding:0;width:100%;line-height:1.1}
.title-in::placeholder,.meta-in::placeholder{color:var(--ink-3)}
.meta-in{border:0;background:transparent;padding:0;width:100%;color:var(--ink-2);font-size:14px}
.tagline{font-size:13px;color:var(--ink-3);font-style:italic;margin:4px 0 0}
.mo-lines{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.mo-lines .quote{font-family:var(--display);font-size:19px;color:var(--ink);font-weight:500}
.mo-lines b{font-weight:600;color:var(--ink)}
.state-line{margin:0;padding:8px 12px;border-radius:8px;background:var(--thin-soft);color:var(--thin);font-size:13px}

.overview{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--sunk)}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ov-head h2{font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink-3)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .l-f::before{background:var(--ok-soft);border:1px solid var(--ok)}
.legend .l-t::before{background:var(--thin-soft);border:1px solid var(--thin)}
.legend .l-e::before{border:1px dashed var(--empty)}
.layer{display:grid;grid-template-columns:136px minmax(0,1fr);gap:8px;align-items:center}
@media (max-width:560px){.layer{grid-template-columns:1fr}}
.layer-name{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.layer-name svg{width:14px;height:14px;flex:none}
.cells{display:grid;gap:5px}
.cells.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cells.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cell{border-radius:7px;padding:6px 7px;font-size:11.5px;line-height:1.25;cursor:pointer;border:1px solid transparent;text-align:left;background:var(--surface);min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:1px}
.cell small{font-size:10px;opacity:.8}
.cell[data-s="filled"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.cell[data-s="thin"]{background:var(--thin-soft);color:var(--thin);border-color:var(--thin-soft)}
.cell[data-s="empty"]{border:1px dashed var(--empty);color:var(--ink-3)}
.cell.here{outline:2px solid var(--accent);outline-offset:1px}

.arch{width:100%;height:auto;display:block}
.band{fill:none;stroke-width:58;transition:opacity .4s}
.band-text{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.14em}
.hump{fill:none;stroke-width:30;stroke-linecap:butt;cursor:pointer;transition:stroke .3s}
.head{cursor:pointer;transition:fill .3s}
.guide{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:2 5}
.curve{fill:none;stroke:var(--ink);stroke-width:3}
.curve.dash{stroke:var(--empty);stroke-width:1.5;stroke-dasharray:5 6}
.dot{cursor:pointer}
.dot.unset{fill:var(--surface);stroke:var(--empty);stroke-width:2;stroke-dasharray:3 3}
.em-label{fill:var(--ink-3);font-size:12px;letter-spacing:.12em;font-family:var(--mono)}
.here-ring{fill:none;stroke:var(--accent);stroke-width:3}
[data-stage="em"] .g-mo,[data-stage="wh"] .g-mo{opacity:.6}
[data-stage="mo"] .g-em,[data-stage="wh"] .g-em{opacity:.45}
[data-stage="mo"] .g-wh,[data-stage="em"] .g-wh{opacity:.5}
.g-mo,.g-em,.g-wh{transition:opacity .4s}

.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:780px){.cols{grid-template-columns:1fr}}
.col{border-left:4px solid var(--mo);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col-name{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.col-name:hover{color:var(--accent)}
.col-desc{font-size:11px;color:var(--ink-3);line-height:1.35;text-transform:uppercase;letter-spacing:.03em}
.col-feel{font-size:13px;overflow-wrap:anywhere}
.muted{color:var(--ink-3);font-size:12px;font-style:italic}
details.tps{font-size:12px;color:var(--ink-2)}
details.tps summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:12px}
details.tps .tp{margin:6px 0 0;padding-left:8px;border-left:2px solid var(--rule)}
details.tps .tp-name{font-weight:600;color:var(--ink)}
details.tps ul{margin:2px 0 0;padding-left:16px;overflow-wrap:anywhere}
.add-tp-mini{background:none;border:1px dashed var(--empty);border-radius:7px;padding:3px 8px;font-size:11px;color:var(--ink-3);cursor:pointer;align-self:flex-start}
.add-tp-mini:hover{border-color:var(--accent);color:var(--accent)}
.foot{font-size:12px;color:var(--ink-3)}
.foot a{color:var(--ink-2)}

/* ---------- steps side ---------- */
.steps{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:1000px){.steps{position:static;max-height:none}}
.steps-top{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px}
.steps-top h2{font-size:17px}
.bar{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:0 4px 8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.stage-head{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 8px;border-radius:10px;cursor:pointer;text-align:left}
.stage-head:hover{background:var(--sunk)}
.stage-ico{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--empty);color:var(--ink-3)}
.stage-ico svg{width:16px;height:16px}
.stage.active .stage-ico{border-color:var(--accent);color:var(--accent)}
.stage.done .stage-ico{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stage-name{font-family:var(--display);font-weight:700;font-size:16px;flex:1}
.stage:not(.active):not(.done) .stage-name{color:var(--ink-3)}
.stage-count{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.stage-intro{margin:0 4px 8px 43px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.stage-intro strong{color:var(--ink)}
.substeps{list-style:none;margin:0 0 6px 21px;padding:0 0 0 22px;display:flex;flex-direction:column;gap:2px;border-left:1.5px solid var(--rule)}
.sub-btn{display:flex;gap:8px;align-items:center;background:none;border:0;padding:5px 6px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink-2);width:100%}
.sub-btn:hover{background:var(--sunk)}
.tick{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--empty);display:grid;place-items:center}
.sub.done .tick{background:var(--ok);border-color:var(--ok)}
.sub.done .tick::after{content:"";width:6px;height:3px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sub.current .tick{border-color:var(--accent);border-width:5px}
.sub.current .sub-btn{color:var(--ink);font-weight:600}
.sub.skipped .tick{border-style:dashed}
.work{margin:6px 0 10px 6px;padding:14px;border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.work-q{font-family:var(--display);font-size:19px;line-height:1.25;font-weight:500}
.work-why{font-size:13px;color:var(--ink-2)}
.work textarea,.work input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:9px 10px;font-size:14px;resize:vertical}
.work textarea{min-height:76px}
.pair{display:grid;gap:6px}
.pair .arrow{text-align:center;color:var(--ink-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cite{font-size:11px;color:var(--ink-3)}
.levels{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.levels .label{width:100%}
.tp-edit{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--rule)}
.tp-edit .row{display:flex;gap:6px;align-items:center}
.tp-edit .row input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:4px 2px;font-weight:600;background:transparent}
.tp-edit textarea{min-height:60px;background:var(--bg)}
.tp-del{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.add-tp{background:none;border:1.5px dashed var(--empty);border-radius:10px;padding:8px;cursor:pointer;color:var(--ink-2);font-size:13px}
.add-tp:hover{border-color:var(--accent);color:var(--accent)}
.coach-say{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.coach-say .who{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex:none;padding-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer}
.secondary{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px}
.link{background:none;border:0;padding:4px;color:var(--ink-3);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.nudge{font-size:12px;color:var(--thin)}
.flash{margin:4px 0 8px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:500}
.finish{display:flex;flex-direction:column;gap:10px;padding:8px 4px}
.save{font-size:11px;color:var(--ink-3);padding:6px 4px 0}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--ink-3)}
.settings select{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:3px 6px;font-size:12px}
.copy-area{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- coach ---------- */
function summary(){
 var L=["Experience: "+(state.title||"(untitled)")+(state.meta?" ("+state.meta+")":""),"Ambition: "+(state.ambition||"(empty)"),"Shift: from "+(state.from||"(empty)")+" to "+(state.to||"(empty)"),"Meaningful Outcomes: "+(state.meanings.join(", ")||"(none chosen)"),"Behaviour: "+(state.behaviour||"(empty)")];
 PH.forEach(function(p,i){L.push(p.n+": feeling "+(state.feel[i]||"(empty)")+"; "+state.tps[i].map(function(tp,t){return(state.tps[i].length>1?(tp.name||"touchpoint "+(t+1))+": ":"")+(lines(tp.moves).join(" / ")||"(empty)")}).join("; "))});
 return L.join("\n");
}
function current(k){if(k==="shift")return"from "+(state.from||"(empty)")+" to "+(state.to||"(empty)");if(k==="meanings")return state.meanings.join(", ")||"(none)";if(k.indexOf("feel")===0)return state.feel[idx(k)]||"(empty)";if(k.indexOf("moves")===0)return allMoves(idx(k)).join(" / ")||"(empty)";return state[k]||"(empty)"}
function ask(k,isPush){
 var fb=localPush(k);
 if(!smp){state.coachMsg[k]=fb;render();return}
 state.coachMsg[k]="Thinking…";render();
 var prompt="You are the coach inside a 5E Experience Design Journey Map. The 5E model was created by Andy Sontag. A designer is filling in their own map, one step at a time.\n\nRules you must follow:\n- Reply with exactly ONE question, at most 25 words.\n- Never suggest wording, feelings, activities, formats or content. The design must stay theirs.\n- Never answer your own question.\n- Keep their own words; help them make those words more precise.\n- For an \"I feel...\" step, ask about the feeling, never about activities.\n- British English. No em dashes. No preamble.\n\n"+(isPush?"They pressed Done, but their answer is still thin. A good question here would be close in spirit to: \""+fb+"\"\n\n":"They asked you for a question to help them think.\n\n")+"The map so far:\n"+summary()+"\n\nThe step: "+stepLabel(k)+" ("+stepQ(k).q+")\nWhat they have written: "+current(k);
 Promise.resolve(smp(prompt,{modelTier:"quick",cache:false,onText:function(u){var t=$("coach-text");if(t)t.textContent=u.text}})).then(function(r){state.coachMsg[k]=((r&&r.text)||fb).trim();render()}).catch(function(e){if(e&&e.code==="not_granted")smp=null;state.coachMsg[k]=fb;render()});
}

/* ---------- save ---------- */
function setStatus(msg){var el=$("save-status");if(!el)return;if(msg){el.textContent=msg;return}
 el.textContent=!capsKnown?"Connecting…":readOnly?"View only: your edits stay on this screen.":art?"Saves as you go.":"This copy cannot save. Use Copy as text to take your work back to the chat."}
function queueSave(){if(!art||readOnly)return;clearTimeout(saveTimer);saveTimer=setTimeout(doSave,500)}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function buildDoc(){
 var hs=document.head.querySelector("style"),reset=hs?hs.textContent:"";
 var json=JSON.stringify(state).replace(/</g,"\\u003c");
 return"<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+reset+"</style></head><body><title>"+esc(document.title)+"</title>"+FONT_LINK+"<style id=\"map-css\">"+$("map-css").textContent+"</style><div id=\"app\"></div><script type=\"application/json\" id=\"map-state\">"+json+"<\/script><script id=\"map-js\">"+$("map-js").textContent+"<\/script></body></html>";
}
function doSave(){if(!art)return;setStatus("Saving…");
 Promise.resolve(art.publish(buildDoc())).then(function(){setStatus("Saved.")}).catch(function(e){var c=e&&e.code;
  if(c==="conflict")setStatus("Loading a newer version…");else if(c==="not_granted"||c==="not_writer"){readOnly=true;setStatus()}else setStatus("Could not save just now. Your work is still on screen.")})}

/* ---------- copy ---------- */
function copyText(){
 var L=["5E Journey: "+(state.title||"untitled")+(state.meta?" ("+state.meta+")":""),"","MEANINGFUL OUTCOMES","Ambition: "+(state.ambition||"[empty]"),"Shift: from "+(state.from||"[empty]")+" to "+(state.to||"[empty]"),"Meaningful Outcomes: "+(state.meanings.join(", ")||"[none chosen]"),"Behaviour: "+(state.behaviour||"[empty]"),"","EMOTIONS AND WHAT HAPPENS"];
 PH.forEach(function(p,i){L.push(p.n+" ("+(state.level[i]||"height not set")+")");L.push("  "+(state.feel[i].trim()||"I feel: [empty]"));
  state.tps[i].forEach(function(tp,t){if(state.tps[i].length>1)L.push("  "+(tp.name||"Touchpoint "+(t+1))+":");var m=lines(tp.moves);L.push(m.length?m.map(function(x){return"    - "+x}).join("\n"):"    [empty]")})});
 var txt=L.join("\n"),b=$("b-copy");
 function fb(){var a=$("copy-area");a.hidden=false;a.value=txt;a.focus();a.select();if(b)b.textContent="Select and copy"}
 try{navigator.clipboard.writeText(txt).then(function(){if(b){b.textContent="Copied";setTimeout(function(){b.textContent="Copy as text"},1500)}},fb)}catch(e){fb()}
}

/* ---------- boot ---------- */
render();
var c=window.claude;
if(c&&typeof c.use==="function"){
 Promise.all([Promise.resolve(c.use("artifact")).catch(function(){return null}),Promise.resolve(c.use("sample")).catch(function(){return null})]).then(function(r){art=r[0];smp=r[1];capsKnown=true;setStatus()});
}else{capsKnown=true;setStatus()}
})();
</script>
